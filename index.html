<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff" id="tcolor">
<title>How to Stop Worrying and Start Living</title>
<style>
:root{
 --bg:#ffffff; --card:#f2f2f7; --card2:#e9e9ee;
 --fg:#000000; --dim:#6c6c70; --dim2:#a1a1a6;
 --ac:#007aff; --acq:rgba(0,122,255,.12); --acfg:#ffffff;
 --line:rgba(0,0,0,.09); --sh:rgba(0,0,0,.08);
}
:root[data-theme="dark"]{
 --bg:#000000; --card:#1c1c1e; --card2:#2c2c2e;
 --fg:#ffffff; --dim:#98989f; --dim2:#6c6c70;
 --ac:#0a84ff; --acq:rgba(10,132,255,.20); --acfg:#ffffff;
 --line:rgba(255,255,255,.12); --sh:rgba(0,0,0,.5);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);
 font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",system-ui,sans-serif;
 font-size:18px;line-height:1.5;overflow-x:hidden;
 -webkit-font-smoothing:antialiased}
img{display:block;max-width:100%}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
.wrap{max-width:760px;margin:0 auto;padding:0 20px}

/* nav */
.top{position:sticky;top:0;z-index:40;background:color-mix(in srgb,var(--bg) 82%,transparent);
 backdrop-filter:saturate(180%) blur(20px);border-bottom:.5px solid var(--line);
 padding:9px 20px;padding-top:calc(9px + env(safe-area-inset-top,0px))}
.topin{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:12px;min-height:38px}
.seg{display:flex;background:var(--card);border-radius:9px;padding:2px;flex:0 0 auto}
.seg button{padding:7px 17px;border-radius:7px;font-size:15px;font-weight:500;color:var(--fg);transition:.15s}
.seg button.on{background:var(--bg);font-weight:600;box-shadow:0 1px 3px var(--sh)}
:root[data-theme="dark"] .seg button.on{background:var(--card2)}
.back{display:flex;align-items:center;gap:3px;font-size:17px;color:var(--ac);margin-left:-6px}
.back[hidden]{display:none}
.back svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.spacer{flex:1}
.tt{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;flex:0 0 auto}
.tt svg{width:20px;height:20px;stroke:var(--dim);fill:none;stroke-width:1.9;stroke-linecap:round}

/* chapter grid */
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;padding:18px 0 48px}
@media(min-width:620px){.grid{grid-template-columns:repeat(3,1fr);gap:18px}}
.tile{display:block;width:100%}
.tile .ph{position:relative;aspect-ratio:1;border-radius:14px;overflow:hidden;background:var(--card)}
.tile .ph img{width:100%;height:100%;object-fit:cover}
.tile .noimg{width:100%;height:100%;background:var(--card);display:grid;place-items:center}
.tile .noimg span{font-size:30px;font-weight:600;color:var(--dim2)}
.tile .lab{font-size:13px;color:var(--dim);margin-top:9px;font-weight:400}
.tile .ttl{font-size:16px;font-weight:600;line-height:1.3;margin-top:2px;letter-spacing:-.2px;
 display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

/* chapter page */
.chead{padding:22px 0 4px}
.chead .lab{font-size:15px;color:var(--dim);font-weight:400}
.chead h1{font-size:32px;font-weight:700;margin:3px 0 0;line-height:1.14;letter-spacing:-.8px}
@media(min-width:620px){.chead h1{font-size:38px}}

.player{position:sticky;top:calc(57px + env(safe-area-inset-top,0px));z-index:30;background:var(--card);
 border-radius:16px;padding:14px 16px;margin:20px 0 8px}
.prow{display:flex;align-items:center;gap:14px}
.play{width:54px;height:54px;flex:0 0 54px;border-radius:50%;background:var(--ac);display:grid;place-items:center}
.play svg{width:23px;height:23px;fill:#fff;margin-left:2px}
.play.playing svg{margin-left:0}
.ptime{font-size:14px;color:var(--dim);font-variant-numeric:tabular-nums;flex:0 0 auto;min-width:104px;text-align:right}
.bar{flex:1;height:34px;display:flex;align-items:center;cursor:pointer;touch-action:none}
.bartrack{width:100%;height:5px;border-radius:3px;background:var(--card2);position:relative}
.barfill{position:absolute;inset:0 auto 0 0;background:var(--ac);border-radius:3px;width:0}
.barknob{position:absolute;top:50%;width:15px;height:15px;border-radius:50%;background:#fff;
 transform:translate(-50%,-50%);left:0;box-shadow:0 1px 4px rgba(0,0,0,.3)}
:root[data-theme="dark"] .barknob{background:#fff}
.skips{display:flex;gap:10px;margin-top:12px;justify-content:center}
.skips button{font-size:14px;color:var(--ac);padding:7px 15px;border-radius:999px;background:var(--bg);font-weight:500}
:root[data-theme="dark"] .skips button{background:var(--card2)}

.subseg{display:flex;background:var(--card);border-radius:9px;padding:2px;margin:16px 0 6px}
.subseg button{flex:1;padding:9px 0;border-radius:7px;font-size:15px;font-weight:500;color:var(--fg)}
.subseg button.on{background:var(--bg);font-weight:600;box-shadow:0 1px 3px var(--sh)}
:root[data-theme="dark"] .subseg button.on{background:var(--card2)}

/* outline */
.sec{padding:22px 0 4px;border-top:.5px solid var(--line)}
.sec:first-of-type{border-top:0}
.sechead{display:block;width:100%;text-align:left;padding:0 0 10px}
.ts{display:inline-block;font-size:14px;font-weight:600;color:var(--ac);font-variant-numeric:tabular-nums;
 background:var(--acq);padding:4px 10px;border-radius:7px;margin-bottom:9px}
.sechead h2{font-size:23px;font-weight:700;margin:0;line-height:1.25;letter-spacing:-.4px}
.sec.lv3 .sechead h2{font-size:20px;font-weight:600;letter-spacing:-.3px}
.sec.playing .ts{background:var(--ac);color:#fff}
.secbody ul{list-style:none;margin:0;padding:0}
.secbody li{position:relative;padding:5px 0 5px 19px;font-size:18.5px;line-height:1.5;letter-spacing:-.2px}
.secbody li:before{content:"";position:absolute;left:3px;top:15px;width:5px;height:5px;border-radius:50%;background:var(--dim2)}
.secbody li.d1{padding-left:38px;font-size:17px;color:var(--dim)}
.secbody li.d1:before{left:22px;width:4px;height:4px;top:14px}
.secbody li.p{padding-left:0}.secbody li.p:before{display:none}
.secbody li.num{padding-left:38px}.secbody li.num:before{display:none}
.secbody li.num span{position:absolute;left:3px;color:var(--ac);font-weight:600}
.secbody b{font-weight:600}
.secbody i{color:var(--dim);font-style:italic}

/* photos */
.pbar{display:flex;gap:9px;padding:16px 0 2px;align-items:center}
.pbar button{font-size:15px;color:var(--fg);background:var(--card);padding:9px 18px;border-radius:999px;font-weight:500}
.pbar button.on{background:var(--ac);color:#fff;font-weight:600}
.pgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;padding:12px 0 48px}
@media(min-width:620px){.pgrid{grid-template-columns:repeat(4,1fr);gap:6px}}
.pgrid.big{grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:620px){.pgrid.big{grid-template-columns:repeat(3,1fr);gap:12px}}
.pcell{position:relative;aspect-ratio:1;background:var(--card);overflow:hidden;border-radius:4px}
.pgrid.big .pcell{border-radius:12px}
.pcell img{width:100%;height:100%;object-fit:cover}
.pcell .hb{position:absolute;right:6px;bottom:6px;width:20px;height:20px;filter:drop-shadow(0 1px 3px rgba(0,0,0,.5))}
.empty{text-align:center;color:var(--dim);padding:80px 20px;font-size:17px;line-height:1.5}

/* lightbox */
.lb{position:fixed;inset:0;z-index:90;background:var(--bg);display:none;flex-direction:column;
 align-items:center;justify-content:center;
 padding:calc(64px + env(safe-area-inset-top,0px)) 14px calc(24px + env(safe-area-inset-bottom,0px))}
.lb.on{display:flex}
.lb img{max-width:100%;max-height:70vh;border-radius:14px;object-fit:contain;position:relative;z-index:2;pointer-events:none}
.lbtop{position:absolute;z-index:3;top:calc(14px + env(safe-area-inset-top,0px));left:16px;right:16px;
 display:flex;justify-content:space-between;align-items:center}
.lbtop button{width:38px;height:38px;border-radius:50%;background:var(--card);display:grid;place-items:center}
.lbtop svg{width:20px;height:20px;stroke:var(--fg);fill:none;stroke-width:2.4;stroke-linecap:round}
.lbcap{margin-top:18px;font-size:15px;color:var(--dim);text-align:center;position:relative;z-index:3}
.lbact{display:flex;margin-top:20px;position:relative;z-index:3}
.lbact button{display:grid;place-items:center;width:56px;height:56px;border-radius:50%;background:var(--card)}
.lbact svg{width:27px;height:27px}
.heart{fill:none;stroke:var(--fg);stroke-width:1.9}
.heart.on{fill:#ff3b30;stroke:#ff3b30}
.nav{position:absolute;top:80px;bottom:150px;width:26%;opacity:0;z-index:1}
.nav.l{left:0}.nav.r{right:0}
</style></head><body>

<div class="top"><div class="topin">
  <button class="back" id="back" hidden><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg><span>Chapters</span></button>
  <div class="seg" id="seg">
    <button data-v="chapters" class="on">Chapters</button>
    <button data-v="images">Photos</button>
  </div>
  <div class="spacer"></div>
  <button class="tt" id="tt" aria-label="Theme"><svg id="ttsvg" viewBox="0 0 24 24"></svg></button>
</div></div>

<div class="wrap" id="app"></div>

<div class="lb" id="lb">
  <div class="lbtop">
    <button id="lbclose"><svg viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"/></svg></button>
    <button id="lbgo"><svg viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg></button>
  </div>
  <button class="nav l" id="lbprev"></button><button class="nav r" id="lbnext"></button>
  <img id="lbimg" alt="">
  <div class="lbcap" id="lbcap"></div>
  <div class="lbact"><button id="lbheart"><svg class="heart" id="lbheartsvg" viewBox="0 0 24 24">
    <path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8l1.1 1L12 21l7.7-7.6 1.1-1a5.5 5.5 0 0 0 0-7.8z"/></svg></button></div>
</div>

<script src="data.js"></script>
<script>
const $=s=>document.querySelector(s), app=$('#app');
const ALL=[]; BOOK.forEach(c=>c.imgs.forEach((f,i)=>ALL.push({f,slug:c.slug,label:c.label,idx:i+1})));
const LS={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},
          set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let hearts=new Set(LS.get('sw_hearts',[]));
const saveH=()=>LS.set('sw_hearts',[...hearts]);
const fmt=s=>{s=Math.max(0,Math.round(s));const m=Math.floor(s/60);return m+':'+String(s%60).padStart(2,'0')};
let audio=new Audio(), curSlug=null, onlyH=false, chTab='outline';

const SUN='<circle cx="12" cy="12" r="4"/><path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M18.7 5.3l-1.6 1.6M6.9 17.1l-1.6 1.6"/>';
const MOON='<path d="M20.5 14.2A8.5 8.5 0 0 1 9.8 3.5a8.5 8.5 0 1 0 10.7 10.7z"/>';
function applyTheme(t){ document.documentElement.setAttribute('data-theme',t);
  $('#ttsvg').innerHTML = t==='dark' ? SUN : MOON;
  $('#tcolor').setAttribute('content', t==='dark' ? '#000000' : '#ffffff'); }
let theme=LS.get('sw_theme',null) || 'light';
applyTheme(theme);
$('#tt').onclick=()=>{theme=theme==='dark'?'light':'dark';LS.set('sw_theme',theme);applyTheme(theme)};

function chapters(){
  $('#back').hidden=true; setSeg('chapters');
  app.innerHTML='<div class="grid">'+BOOK.map(c=>{
    const im=c.imgs.length?`<img loading="lazy" src="thumb/${c.imgs[0]}" alt="">`
      :`<div class="noimg"><span>${c.n===0?'—':c.n}</span></div>`;
    return `<a class="tile" href="#ch/${c.slug}"><div class="ph">${im}</div>
      <div class="lab">${c.label}</div><div class="ttl">${c.title}</div></a>`;
  }).join('')+'</div>';
}

function chapter(slug){
  const c=BOOK.find(x=>x.slug===slug); if(!c) return chapters();
  $('#back').hidden=false; setSeg('chapters');
  const hasImgs=c.imgs.length>0;
  if(!hasImgs) chTab='outline';
  const tabs=hasImgs?`<div class="subseg" id="subseg">
      <button data-t="outline" class="${chTab==='outline'?'on':''}">Outline</button>
      <button data-t="photos" class="${chTab==='photos'?'on':''}">Photos</button></div>`:'';
  const outline=c.secs.map((s,i)=>
    `<div class="sec lv${s.lv}" data-i="${i}"><div class="secbody">
      <button class="sechead" data-seek="${s.t}"><span class="ts">${fmt(s.t)}</span><h2>${s.h}</h2></button>
      ${s.b}</div></div>`).join('');
  const photos=`<div class="pgrid big">`+c.imgs.map(f=>
    `<button class="pcell" data-open="${f}"><img loading="lazy" src="thumb/${f}" alt="">
     ${hearts.has(f)?heartBadge():''}</button>`).join('')+`</div>`;
  app.innerHTML=`<div class="chead"><div class="lab">${c.label}</div><h1>${c.title}</h1></div>
  <div class="player">
    <div class="prow">
      <button class="play" id="pp"><svg id="ppi" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></button>
      <div class="bar" id="bar"><div class="bartrack"><div class="barfill" id="fill"></div><div class="barknob" id="knob"></div></div></div>
      <div class="ptime" id="ptime">0:00 / ${fmt(c.dur)}</div>
    </div>
    <div class="skips"><button data-sk="-15">&minus;15s</button><button data-sk="15">+15s</button>
      <button id="rate">1&times;</button></div>
  </div>${tabs}
  <div id="chbody">${chTab==='photos'&&hasImgs?photos:outline}</div>
  <div style="height:44px"></div>`;
  if(curSlug!==slug){ audio.pause(); audio=new Audio('audio/'+c.audio); audio.preload='metadata'; curSlug=slug; }
  wirePlayer(c);
  const ss=$('#subseg');
  if(ss) ss.querySelectorAll('button').forEach(b=>b.onclick=()=>{chTab=b.dataset.t;chapter(slug);});
  bindOpens();
}

function heartBadge(){return '<svg class="hb" viewBox="0 0 24 24" fill="#ff3b30"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8l1.1 1L12 21l7.7-7.6 1.1-1a5.5 5.5 0 0 0 0-7.8z"/></svg>'}

function images(){
  $('#back').hidden=true; setSeg('images');
  const list=onlyH?ALL.filter(x=>hearts.has(x.f)):ALL;
  app.innerHTML=`<div class="pbar">
      <button data-f="all" class="${onlyH?'':'on'}">All</button>
      <button data-f="h" class="${onlyH?'on':''}">Hearted</button></div>`
    + (list.length?'<div class="pgrid">'+list.map(x=>
      `<button class="pcell" data-open="${x.f}"><img loading="lazy" src="thumb/${x.f}" alt="">
       ${hearts.has(x.f)?heartBadge():''}</button>`).join('')+'</div>'
      : '<div class="empty">Nothing hearted yet.<br>Tap a photo, then tap the heart.</div>');
  app.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{onlyH=b.dataset.f==='h';images()});
  bindOpens();
}
function setSeg(v){document.querySelectorAll('#seg button').forEach(b=>b.classList.toggle('on',b.dataset.v===v))}
function bindOpens(){app.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>openLB(b.dataset.open))}

function wirePlayer(c){
  const pp=$('#pp'),ppi=$('#ppi'),fill=$('#fill'),knob=$('#knob'),bar=$('#bar'),pt=$('#ptime'),rate=$('#rate');
  const PL='M8 5v14l11-7z', PA='M7 5h3.6v14H7zM13.4 5H17v14h-3.6z';
  const icon=()=>{ppi.innerHTML=`<path d="${audio.paused?PL:PA}"/>`;pp.classList.toggle('playing',!audio.paused)};
  const draw=()=>{const d=audio.duration||c.dur||1,p=Math.min(1,(audio.currentTime||0)/d);
    fill.style.width=(p*100)+'%';knob.style.left=(p*100)+'%';
    pt.textContent=fmt(audio.currentTime||0)+' / '+fmt(d);
    let act=-1; c.secs.forEach((s,i)=>{if((audio.currentTime||0)+0.4>=s.t)act=i});
    app.querySelectorAll('.sec').forEach(el=>el.classList.toggle('playing',+el.dataset.i===act));};
  pp.onclick=()=>{audio.paused?audio.play():audio.pause();icon()};
  audio.ontimeupdate=draw; audio.onloadedmetadata=draw; audio.onplay=icon; audio.onpause=icon; draw(); icon();
  app.querySelectorAll('[data-seek]').forEach(b=>b.onclick=()=>{
    audio.currentTime=+b.dataset.seek; audio.play().catch(()=>{}); icon(); draw();
    window.scrollTo({top:window.scrollY+b.getBoundingClientRect().top-160,behavior:'smooth'});});
  app.querySelectorAll('[data-sk]').forEach(b=>b.onclick=()=>{audio.currentTime=Math.max(0,audio.currentTime+ +b.dataset.sk);draw()});
  const rates=[1,1.25,1.5,1.75,2]; let ri=rates.indexOf(audio.playbackRate); if(ri<0)ri=0;
  rate.textContent=rates[ri]+'×';
  rate.onclick=()=>{ri=(ri+1)%rates.length;audio.playbackRate=rates[ri];rate.textContent=rates[ri]+'×'};
  const seek=e=>{const r=bar.getBoundingClientRect(),x=(e.touches?e.touches[0].clientX:e.clientX);
    const p=Math.min(1,Math.max(0,(x-r.left)/r.width)); audio.currentTime=p*(audio.duration||c.dur); draw();};
  let dragging=false;
  bar.addEventListener('pointerdown',e=>{dragging=true;bar.setPointerCapture(e.pointerId);seek(e)});
  bar.addEventListener('pointermove',e=>{if(dragging)seek(e)});
  bar.addEventListener('pointerup',()=>dragging=false);
}

let lbList=[],lbI=0;
function openLB(f){
  const h=location.hash;
  if(h.startsWith('#ch/')){ const c=BOOK.find(x=>x.slug===h.slice(4));
    lbList=ALL.filter(x=>x.slug===c.slug); }
  else lbList = onlyH ? ALL.filter(x=>hearts.has(x.f)) : ALL;
  lbI=lbList.findIndex(x=>x.f===f); if(lbI<0){lbList=ALL;lbI=ALL.findIndex(x=>x.f===f)}
  $('#lb').classList.add('on'); paintLB(); }
function paintLB(){ const x=lbList[lbI]; if(!x)return;
  $('#lbimg').src='img/'+x.f;
  $('#lbcap').textContent=x.label+'  ·  '+x.idx+' of '+BOOK.find(c=>c.slug===x.slug).imgs.length;
  $('#lbheartsvg').classList.toggle('on',hearts.has(x.f)); }
$('#lbclose').onclick=()=>$('#lb').classList.remove('on');
$('#lbprev').onclick=()=>{lbI=(lbI-1+lbList.length)%lbList.length;paintLB()};
$('#lbnext').onclick=()=>{lbI=(lbI+1)%lbList.length;paintLB()};
$('#lbheart').onclick=()=>{const f=lbList[lbI].f; hearts.has(f)?hearts.delete(f):hearts.add(f); saveH(); paintLB(); route();};
$('#lbgo').onclick=()=>{const x=lbList[lbI];$('#lb').classList.remove('on');location.hash='#ch/'+x.slug};
document.addEventListener('keydown',e=>{ if(!$('#lb').classList.contains('on'))return;
  if(e.key==='Escape')$('#lb').classList.remove('on');
  if(e.key==='ArrowLeft')$('#lbprev').click(); if(e.key==='ArrowRight')$('#lbnext').click();});

document.querySelectorAll('#seg button').forEach(b=>b.onclick=()=>location.hash='#'+b.dataset.v);
$('#back').onclick=()=>location.hash='#chapters';
function route(){ const h=location.hash||'#chapters';
  if(h.startsWith('#ch/')) chapter(h.slice(4));
  else if(h.startsWith('#images')) images();
  else chapters();
}
addEventListener('hashchange',()=>{chTab='outline';window.scrollTo(0,0);route()});
route();
</script></body></html>
